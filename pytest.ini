[pytest]
minversion = 8.0
addopts = -ra -vv --strict-markers --strict-config --cov=phase7 --cov-report=term-missing
pythonpath =
	.
	src
testpaths = tests
filterwarnings =
	default
markers =
	unit: Fast isolated tests for a single module or function.
	integration: Multi-module or file-system integrated tests.
	regression: Stability and reproducibility regression tests.
	artifact: Artifact serialization and validation tests.
	deterministic: Deterministic execution and reproducibility tests.
xfail_strict = true
